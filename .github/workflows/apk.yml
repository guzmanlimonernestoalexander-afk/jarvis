name: Compilar APK de Jarvis

# La app de Android completa viene al final de este archivo (en comentarios).
# Cada vez que cambia este archivo, GitHub la compila y publica jarvis.apk en "Releases".

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sacar el código de la app de este mismo archivo
        run: |
          python3 - <<'PY'
          import os
          src = open('.github/workflows/apk.yml', encoding='utf-8').read().split('\n')
          i = src.index('#==== CODIGO ====')
          files, cur = {}, None
          for l in src[i + 1:]:
              if l.startswith('#>>> '):
                  cur = l[5:].strip(); files[cur] = []
              elif cur and l.startswith('#'):
                  files[cur].append(l[1:])
          for path, body in files.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(body).rstrip('\n') + '\n')
              print(path)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Llave de firma (se crea una sola vez y se guarda en el repo)
        run: |
          if [ ! -f jarvis.keystore ]; then
            keytool -genkeypair -noprompt -keystore jarvis.keystore -storepass jarvis-apk -keypass jarvis-apk \
              -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jarvis"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jarvis.keystore
            git commit -m "Llave de firma del APK"
            git push
          fi

      - name: Compilar
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publicar el APK para descargarlo en el teléfono
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk jarvis.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk jarvis.apk --title "Jarvis para Android" \
            --notes "Versión ${{ github.run_number }}. Abre este enlace en tu teléfono, descarga jarvis.apk e instálalo." --latest

